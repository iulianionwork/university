<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profesor Profile</title>
</head>
<body>
<form method="get" th:action="@{'/admin/professors'}">
    <input class="btn" type="submit" name="back" value="Inapoi">
</form>
<h1 th:text="'Professor: ' + ${professor.firstName()} + ' ' + ${professor.lastName()}"></h1>
<form method="get" th:action="@{/admin/professors/{professorId}/password(professorId=${professor.id()})}">
    <input class="btn" type="submit" name="passowrd" value="Modifica parola">
</form>

<p>Email: <span th:text="${professor.email}"></span></p>
<p>Departament: <span th:text="${professor.department()}"></span></p>


<h2>Cursurile profresorului:</h2>
<p th:if="${courses.isEmpty()}">Nu are cursuri.</p>
<table th:unless="${courses.isEmpty()}">
    <tr><th>Curs</th></tr>
    <tr th:each="curs : ${courses}">
        <td th:text="${curs.courseName()}"></td>
    </tr>
</table>
</body>
</html>
