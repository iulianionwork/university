
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Profile</title>
</head>
<body>
<h1 th:text="'Student: ' + ${student.firstName()} + ' ' + ${student.lastName()}"></h1>
<form method="get" th:action="@{/admin/students/{studentId}/password(studentId=${student.id()})}">
    <input class="btn" type="submit" name="password" value="Modifica parola">
</form>
<p><span>Email:</span>  <b th:text="${student.email}"></b></p>
<p><span>Grupa:</span> <b th:text="${student.groupName()} ?: 'fara grupa'"></b></p>

<p th:if="${carnet != null}"><span>Carnet: </span> Nr. <b th:text="${carnet.carnetNumber}"></b>,
    emis la <b th:text="${#temporals.format(carnet.issueDate(),'dd.MM.yyyy')}"></b> </p>

<div th:if="${carnet == null}">
    <p>Carnet: null</p>
<form method="post" th:action="@{/admin/students/{studentId}/carnet(studentId=${student.id()})}">
    <input class="btn" type="submit" name="carnet" value="Emite carnet">
</form>
</div>


<h2>Cursurile studentului</h2>
<p th:if="${courses.isEmpty()}">Nu este inscris la nici un curs.</p>
<table th:unless="${courses.isEmpty()}">
    <tr><th>Curs</th><th>Profesor</th><th>Detalii Curs</th></tr>
    <tr th:each="curs : ${courses}">
        <td th:text="${curs.courseName()}"></td>
        <td th:text="${curs.professorName()}"></td>
        <td>
            <form method="get" th:action="@{/admin/courses/{courseId}(courseId=${curs.id()})}">
                <input class="btn" type="submit" name="detalii" value="Detalii curs">
            </form>
        </td>

    </tr>
</table>
</body>
</html>
