<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Students</title>
</head>
<body>
<form method="get" th:action="@{'/admin/home'}">
    <input class="btn" type="submit" name="back" value="Inapoi">
</form>
<h3>Studenti:</h3>
<p th:if="${students.isEmpty()}">Nu sunt studenti in baza.</p>
<table th:unless="${students.isEmpty()}">
    <tr><th>Email</th><th>Nume</th><th>Prenume</th><th>Grupa</th><th>Detali Student</th></tr>
    <tr th:each="student : ${students}">
        <td th:text="${student.email()}"></td>
        <td th:text="${student.firstName()}"></td>
        <td th:text="${student.lastName()}"></td>
        <td th:text="${student.groupName()}"></td>
        <td>
            <form method="get" th:action="@{/admin/students/{studentId}(studentId=${student.id()})}">
                <input class="btn" type="submit" name="profil" value="Profil">
            </form>
        </td>
    </tr>
</table>


</body>

</html>
