<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Studenti inrolati</title>
</head>
<body>

<h2 th:text="${courseName}"></h2>
<h3>Studenti:</h3>
<p th:if="${students.isEmpty()}">Nu ai studenti.</p>
<table th:unless="${students.isEmpty()}">
    <tr><th>Email</th><th>Nume</th><th>Prenume</th><th>Grupa</th></tr>
    <tr th:each="student : ${students}">
        <td th:text="${student.email()}"></td>
        <td th:text="${student.firstName()}"></td>
        <td th:text="${student.lastName()}"></td>
        <td th:text="${student.groupName()}"></td>
    </tr>
</table>

<a th:href="@{'/professor/home'}"><- Inapoi</a>
</body>
</html>
